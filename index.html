const cv=$("chart"), ctx=cv.getContext("2d");
let W=0,H=0,dpr=1;
function resize(){
  dpr=window.devicePixelRatio||1;
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAD_R=82, PAD_B=28, PAD_T=70, MONO="'JetBrains Mono',ui-monospace,Consolas,monospace";
let mouse=null;
cv.addEventListener("mousemove",e=>{ const r=cv.getBoundingClientRect(); mouse={x:e.clientX-r.left,y:e.clientY-r.top}; });
cv.addEventListener("mouseleave",()=>{ mouse=null; S.hover=null; });
cv.addEventListener("wheel",e=>{ e.preventDefault(); S.zoom=Math.min(4,Math.max(.35,S.zoom*(e.deltaY<0?1.1:.9))); },{passive:false});
cv.addEventListener("click",e=>{
  if(!S.order||!S._py) return;
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(x>W-PAD_R||y<PAD_T-20||y>H-PAD_B) return;
  S.orderLevel=S._py(y); renderProfit();
});
function fmtTime(ms){ return new Date(ms).toTimeString().slice(0,S.tf<60?8:5); }

function draw(){
  requestAnimationFrame(draw);
  if(!W||S.view!=="home") return;
  const up=css("--up"), dn=css("--down"), lt=document.documentElement.dataset.theme==="light";
  const ov=a=>`rgba(${lt?"0,0,0":"255,255,255"},${a})`, axis=lt?"#7a808b":"#6c6c74", pn=css("--solid"), pn2=css("--solid2"), txc=css("--text"), tagBg=lt?"#1c1c1e":"#fff", tagFg=lt?"#fff":"#111";
  ctx.clearRect(0,0,W,H);
  const step=9*S.zoom, plotW=W-PAD_R, plotH=H-PAD_B-PAD_T;
  const now=Date.now(), cs=S.candles, last=cs[cs.length-1], price=S.price, tfms=S.tf*1000, d=dec();
  const xNow=plotW*0.72;
  const tx=t=>xNow+((t-last.t)/tfms)*step+step/2;
  const vis=cs.slice(-(Math.ceil(xNow/step)+2));
  const u=U(), myOpen=u?u.trades.filter(t=>t.status==="open"&&t.asset===S.asset&&t.acct===u.acct):[];
  const myOrders=u?u.pending.filter(o=>o.asset===S.asset&&o.acct===u.acct):[];
  let lo=Infinity, hi=-Infinity;
  for(const c of vis){ lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); }
  for(const t of myOpen){ lo=Math.min(lo,t.entry); hi=Math.max(hi,t.entry); }
  const m=(hi-lo)*0.12||1e-6; lo-=m; hi+=m;
  const span=S.yMax-S.yMin;
  if(!(span>0)||!isFinite(S.yMin)||Math.abs(lo-S.yMin)>span*2||Math.abs(hi-S.yMax)>span*2){ S.yMin=lo; S.yMax=hi; }  // new asset or first frame: snap
  else{ S.yMin+=(lo-S.yMin)*0.12; S.yMax+=(hi-S.yMax)*0.12; }
  const y=p=>PAD_T+(S.yMax-p)/(S.yMax-S.yMin)*plotH;
  const py=v=>S.yMax-(v-PAD_T)/plotH*(S.yMax-S.yMin);
  S._py=py;

  ctx.font="11px "+MONO; ctx.textBaseline="middle";
  const rawStep=(S.yMax-S.yMin)/6, mag=Math.pow(10,Math.floor(Math.log10(rawStep)));
  const gs=[1,2,5,10].map(k=>k*mag).find(s=>s>=rawStep);
  ctx.strokeStyle=ov(.05); ctx.fillStyle=axis; ctx.textAlign="left";
  for(let v=Math.ceil(S.yMin/gs)*gs; v<S.yMax; v+=gs){
    const yy=y(v); if(yy<PAD_T-20||yy>H-PAD_B) continue;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(plotW,yy); ctx.stroke();
    ctx.fillText(v.toFixed(d),plotW+10,yy);
  }
  const per=Math.ceil(110/step); ctx.textAlign="center";
  for(let i=vis.length-1;i>=0;i-=per){
    const x=tx(vis[i].t); if(x<20||x>plotW) continue;
    ctx.strokeStyle=ov(.04); ctx.beginPath(); ctx.moveTo(x,PAD_T-20); ctx.lineTo(x,H-PAD_B); ctx.stroke();
    ctx.fillStyle=axis; ctx.fillText(fmtTime(vis[i].t),x,H-PAD_B+14);
  }

  S.hover=null;
  for(const c of vis){
    const x=tx(c.t), col=c.c>=c.o?up:dn, bw=Math.max(1,step*0.62);
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1;
    if(c===last){ ctx.shadowBlur=16; ctx.shadowColor=col; }
    ctx.beginPath(); ctx.moveTo(Math.round(x)+.5,y(c.h)); ctx.lineTo(Math.round(x)+.5,y(c.l)); ctx.stroke();
    const yo=y(c.o), yc=y(c.c), bh=Math.max(1,Math.abs(yo-yc));
    ctx.beginPath(); ctx.roundRect(x-bw/2,Math.min(yo,yc),bw,bh,Math.min(2.5,bw/3,bh/2)); ctx.fill();
    ctx.shadowBlur=0;
    if(mouse&&Math.abs(mouse.x-x)<step/2) S.hover=c;
  }

  for(const t of myOpen){
    const xs=tx(t.start), xe=tx(t.end), ye=y(t.entry), col=t.dir==="up"?up:dn;
    ctx.save();
    ctx.setLineDash([4,4]); ctx.strokeStyle=ov(.25);
    ctx.beginPath(); ctx.moveTo(xs,PAD_T-30); ctx.lineTo(xs,H-PAD_B); ctx.moveTo(xe,PAD_T-30); ctx.lineTo(xe,H-PAD_B); ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle=col; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(xs,ye); ctx.lineTo(xe,ye); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(xs,ye,4,0,7); ctx.fill();
    const winning=t.dir==="up"?price>t.entry:price<t.entry, left=Math.max(0,Math.ceil((t.end-now)/1000));
    const txt=`${t.dir==="up"?"↑":"↓"} AED ${t.amt}  ${winning?"+"+(t.amt*t.pay).toFixed(2):(t.rf?"RF":"−"+t.amt.toFixed(2))}  ${left}s`;
    ctx.font="600 11px "+MONO; const w=ctx.measureText(txt).width+16, bx=Math.max(4,Math.min(xe-w/2,plotW-w));
    ctx.fillStyle=winning?up:dn; ctx.beginPath(); ctx.roundRect(bx,ye-24,w,20,10); ctx.fill();
    ctx.fillStyle="#04140a"; ctx.textAlign="left"; ctx.fillText(txt,bx+8,ye-14);
    ctx.restore();
  }
  // pending orders + order target being placed
  const levels=myOrders.map(o=>({v:o.level,col:o.dir==="up"?up:dn,txt:`${o.dir==="up"?"↑":"↓"} order AED ${o.amt}`}));
  if(S.order&&S.orderLevel!=null) levels.push({v:S.orderLevel,col:"#9a9aa3",txt:"target"});
  for(const L of levels){
    const yy=y(L.v); if(yy<PAD_T-20||yy>H-PAD_B) continue;
    ctx.setLineDash([2,3]); ctx.strokeStyle=L.col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(plotW,yy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=pn; ctx.strokeStyle=L.col; ctx.beginPath(); ctx.roundRect(plotW+4,yy-11,PAD_R-8,22,11); ctx.fill(); ctx.stroke();
    ctx.fillStyle=txc; ctx.font="12px "+MONO; ctx.textAlign="center"; ctx.fillText("+ "+L.v.toFixed(d),plotW+PAD_R/2,yy);
    ctx.fillStyle=L.col; ctx.font="11px "+MONO; ctx.textAlign="left"; ctx.fillText(L.txt,10,yy-8);
  }

  const durMs=DURS[S.durIdx]*1000, xs0=tx(now), xe0=tx(now+durMs);
  ctx.fillStyle=axis; ctx.font="11px "+MONO; ctx.textAlign="center";
  ctx.fillText("Trade",xs0-14,PAD_T-42); ctx.fillText("start",xs0-14,PAD_T-28);
  if(xe0<plotW){
    ctx.fillText("Trade",xe0+14,PAD_T-42); ctx.fillText("end",xe0+14,PAD_T-28);
    ctx.setLineDash([2,4]); ctx.strokeStyle=ov(.13); ctx.beginPath(); ctx.moveTo(xe0,PAD_T-20); ctx.lineTo(xe0,H-PAD_B); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.setLineDash([2,4]); ctx.strokeStyle=ov(.19); ctx.beginPath(); ctx.moveTo(xs0,PAD_T-20); ctx.lineTo(xs0,H-PAD_B); ctx.stroke(); ctx.setLineDash([]);

  const yp=y(price), cdn=Math.max(0,Math.ceil((last.t+tfms-now)/1000));
  ctx.strokeStyle=ov(.65); ctx.lineWidth=1;
  ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(0,yp+.5); ctx.lineTo(plotW,yp+.5); ctx.stroke(); ctx.setLineDash([]);
  { const lc=last.c>=last.o?up:dn, rx=tx(last.t), rr=4+((Math.sin(now/260)+1)/2)*9;
    ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle=lc; ctx.beginPath(); ctx.arc(rx,yp,rr,0,7); ctx.fill();
    ctx.globalAlpha=1; ctx.beginPath(); ctx.arc(rx,yp,3.6,0,7); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=pn; ctx.strokeStyle=ov(.33); ctx.beginPath(); ctx.roundRect(xNow+14,yp-10,54,20,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle=txc; ctx.textAlign="center"; ctx.fillText("00:"+String(cdn).padStart(2,"0"),xNow+41,yp);
  ctx.fillStyle=tagBg; ctx.beginPath(); ctx.roundRect(plotW+4,yp-11,PAD_R-8,22,11); ctx.fill();
  ctx.fillStyle=tagFg; ctx.font="600 12px "+MONO; ctx.fillText(price.toFixed(d),plotW+PAD_R/2,yp);

  if(mouse&&mouse.x<plotW&&mouse.y>PAD_T-20&&mouse.y<H-PAD_B){
    ctx.setLineDash([2,3]); ctx.strokeStyle=ov(.33);
    ctx.beginPath(); ctx.moveTo(0,mouse.y); ctx.lineTo(plotW,mouse.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=pn2; ctx.beginPath(); ctx.roundRect(plotW+4,mouse.y-11,PAD_R-8,22,11); ctx.fill();
    ctx.fillStyle=txc; ctx.font="12px "+MONO; ctx.textAlign="center"; ctx.fillText(py(mouse.y).toFixed(d),plotW+PAD_R/2,mouse.y);
    const tAt=last.t+Math.round((mouse.x-xNow-step/2)/step)*tfms, lbl=fmtTime(tAt), w=ctx.measureText(lbl).width+16;
    ctx.fillStyle=pn2; ctx.beginPath(); ctx.roundRect(mouse.x-w/2,H-PAD_B+2,w,22,6); ctx.fill();
    ctx.fillStyle=txc; ctx.fillText(lbl,mouse.x,H-PAD_B+13);
  }
}

// =====================================================================
// simulated "other traders" feed
// =====================================================================
const COLORS=["#6ee7b7","#fbbf24","#a78bfa","#f87171","#60a5fa","#f472b6","#34d399"];
function feedItem(){
  const f=$("feed"), isUp=Math.random()<.5, dur=["5s","5s","5s","35s","1m","3m","4m"][Math.random()*7|0];
  const s=document.createElement("span");
  s.innerHTML=`<i class="av" style="background:${COLORS[Math.random()*COLORS.length|0]}"></i>${dur} <b class="${isUp?"u":"d"}">${isUp?"Up ↑":"Down ↓"}</b>`;
  f.prepend(s); while(f.children.length>14) f.lastChild.remove();
}
function wobbleOnline(){ const n=$("onlineN"); n.textContent=Math.max(5000,(+n.textContent)+(Math.random()*40-20|0)); }

// =====================================================================
// init
// =====================================================================
function renderNotices(){
  const b=$("banner"); b.textContent=CFG.banner||""; b.className=(CFG.banner?"on ":"")+(CFG.bannerType||"info");
  $("maintMsg").textContent=CFG.maintMsg||""; $("maint").classList.toggle("on",!!CFG.maintenance);
}
function afterCfg(){
  applyCfg(); S.durIdx=Math.min(S.durIdx,DURS.length-1); renderNotices();
  if(U()){ fillAssets(); renderAll(); if(S.view!=="home") renderPage(); }
  if(S.view==="market") fillMarket();
}
// the admin console and other tabs share this storage: pick up their changes live
addEventListener("storage",e=>{
  if(e.key===CFGKEY){ loadCfg(); afterCfg(); }
  else if(e.key===KEY && e.newValue){
    try{ const d=JSON.parse(e.newValue); if(d&&d.users){ DB=d; if(!DB.events) DB.events=[]; if(U()){ renderAll(); if(S.view!=="home") renderPage(); } } }catch(err){}
  }
});
applyCfg(); renderNotices();
seedAll(); resize();
for(let i=0;i<12;i++) feedItem();
if(DB.session && !U()) DB.session=null;
ensureDemo();
if(U()){ bindUser(); } else { renderAll(); showAuth("login"); }
setInterval(tick,250);
setInterval(feedItem,1800);
setInterval(wobbleOnline,3000);
requestAnimationFrame(draw);

// loading screen
(function(){
  const steps=[["Connecting to markets…",30],["Loading assets…",60],["Preparing your account…",90],["Ready",100]];
  let i=0;
  (function next(){
    const [msg,pct]=steps[i++]; $("ldMsg").textContent=msg; $("ldFill").style.width=pct+"%";
    if(i<steps.length) setTimeout(next,i===steps.length-1?450:380);
    else setTimeout(()=>{ $("splash").classList.add("done"); setTimeout(()=>$("splash").remove(),600); },350);
  })();
})();
</script>
