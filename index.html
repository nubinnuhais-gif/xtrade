<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Xtrade – Demo Trading Platform</title>
<script>try{var _t=localStorage.getItem("ts_theme");if(_t)document.documentElement.dataset.theme=_t;document.documentElement.dataset.skin="amber"}catch(e){}</script>
<style>
  :root{
    --bg:#080913; --panel:rgba(24,27,48,.62); --panel2:rgba(255,255,255,.06); --solid:#14172b; --solid2:#1e2242;
    --line:rgba(255,255,255,.09); --text:#eef0ff; --muted:#8f94b6;
    --up:#20e08f; --down:#ff4f70; --accent:#19f0a8; --accent2:#7c5cff;
    --glow-up:0 10px 30px rgba(32,224,143,.32); --glow-down:0 10px 30px rgba(255,79,112,.32);
    --r:18px;
    --font:'Plus Jakarta Sans',system-ui,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.35 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a{color:var(--accent)}
  #balV,#amt,#dur,#lastPx,.card b,td,.tr small,.tr .r,#ohlc span,#onlineN,.pf b,.tx b,.t b{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* animated aurora background */
  body::before,body::after{content:"";position:fixed;width:48vmax;height:48vmax;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;animation:drift 24s ease-in-out infinite alternate}
  body::before{background:var(--accent2);opacity:.34;left:-14vmax;top:-16vmax}
  body::after{background:var(--accent);opacity:.2;right:-16vmax;bottom:-20vmax;animation-duration:30s}
  @keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}

  #app{display:grid;grid-template-columns:92px 1fr 264px;grid-template-rows:68px 1fr 50px;gap:12px;padding:12px;height:100vh;position:relative;z-index:1}
  #side,#top,#chartWrap,#right,#feed,#page{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}
  #side{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  #top{animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
  #chartWrap{animation:rise .8s .16s cubic-bezier(.2,.8,.2,1) both}
  #right{animation:rise .8s .24s cubic-bezier(.2,.8,.2,1) both}
  #feed{animation:rise .8s .32s cubic-bezier(.2,.8,.2,1) both}

  /* dock */
  #side{grid-column:1;grid-row:1/4;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
  #logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;color:#04140c;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:14px;box-shadow:0 8px 24px rgba(124,92,255,.4);animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-3px)}}
  .nav{position:relative;width:68px;padding:11px 0 9px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;transition:color .2s,background .2s,transform .2s}
  .nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
  .nav:hover{color:var(--text);background:var(--panel2)}
  .nav:hover svg{transform:translateY(-2px) scale(1.1)}
  .nav.out:hover{color:var(--down);background:color-mix(in srgb,var(--down) 14%,transparent)}  .nav.on{color:var(--accent);background:linear-gradient(135deg,rgba(25,240,168,.14),rgba(124,92,255,.14))}
  .nav.on::before{content:"";position:absolute;left:-12px;top:22%;bottom:22%;width:4px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  #online{margin-top:auto;text-align:center;font-size:11px;color:var(--muted);position:relative}
  #online b{display:block;color:var(--text);font-size:13px}
  #online::before{content:"";display:block;width:8px;height:8px;margin:0 auto 6px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 var(--up);animation:ping 1.8s infinite}
  @keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}

  /* top bar */
  #top{grid-column:2/4;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 14px}
  .tab{padding:10px 16px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;transition:all .2s}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--text);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line),0 4px 16px rgba(0,0,0,.18)}
  .menuWrap{position:relative}
  #balWrap{margin-left:auto}
  #balBtn{text-align:right;padding:5px 12px;border-radius:12px;transition:background .2s}
  #balBtn:hover{background:var(--panel2)}
  #balBtn b{font-size:17px;display:block;font-weight:700}
  #balBtn small{color:var(--muted);font-size:11px}
  #balV.bu{animation:balUp .9s}
  #balV.bd{animation:balDown .9s}
  @keyframes balUp{0%,40%{color:var(--up);text-shadow:0 0 18px var(--up)}}
  @keyframes balDown{0%,40%{color:var(--down);text-shadow:0 0 18px var(--down)}}
  #pay,.btn.primary{position:relative;overflow:hidden;background:linear-gradient(135deg,#27f5b0,#12c48b);color:#03140c;font-weight:800;padding:12px 20px;border-radius:12px;white-space:nowrap;box-shadow:0 8px 22px rgba(25,240,168,.28);transition:transform .15s,box-shadow .2s}
  #pay:hover,.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(25,240,168,.4)}
  #pay::after,.btn.primary::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 4s infinite}
  @keyframes shine{0%,55%{left:-70%}100%{left:140%}}
  #avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04140a;font-weight:800;font-size:16px;transition:transform .2s}
  #avatar:hover{transform:rotate(-6deg) scale(1.06)}
  #themeBtn{width:42px;height:42px;border-radius:12px;font-size:17px;background:var(--panel2);border:1px solid var(--line);transition:transform .35s,background .2s}
  #themeBtn:hover{transform:rotate(25deg) scale(1.08)}
  .menu{display:none;position:absolute;right:0;top:54px;min-width:250px;background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:6px;z-index:30;box-shadow:0 20px 50px rgba(0,0,0,.45);transform-origin:top right}
  .menu.open{display:block;animation:pop .18s ease-out}
  .menu button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:10px;text-align:left;transition:background .15s}
  .menu button:hover{background:var(--panel2)}
  .menu button.cur{color:var(--accent)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  .menu .who{padding:8px 12px;color:var(--muted);font-size:12px}

  /* chart */
  #chartWrap{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0;overflow:hidden}
  #chart{position:absolute;inset:0;width:100%;height:100%;display:block}
  #addBtn{position:absolute;left:14px;top:14px;display:flex;gap:10px;z-index:2;align-items:center;flex-wrap:wrap;right:14px}
  #addBtn .sq,#asset,#lastPx{background:var(--solid);border:1px solid var(--line);border-radius:14px;height:44px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  #addBtn .sq{width:44px;font-size:22px;transition:transform .2s,background .2s}
  #addBtn .sq:hover{transform:rotate(90deg);background:var(--solid2)}
  #asset{display:flex;align-items:center;gap:8px;padding:0 14px}
  #asset em{font-style:normal;color:#04140c;background:var(--up);font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px}
  #asset select{background:none;border:0;color:var(--text);font:600 14px var(--font);outline:none;cursor:pointer}
  #asset select option{background:var(--solid)}
  #lastPx{display:flex;align-items:center;gap:10px;padding:0 14px;transition:box-shadow .2s}
  #lastPx b{font-size:16px}
  #lastPx span{font-size:11px;font-weight:700}
  #lastPx.fu{animation:flashU .55s}
  #lastPx.fd{animation:flashD .55s}
  @keyframes flashU{0%{box-shadow:0 0 0 2px var(--up),0 0 24px rgba(32,224,143,.5)}}
  @keyframes flashD{0%{box-shadow:0 0 0 2px var(--down),0 0 24px rgba(255,79,112,.5)}}
  #tools{position:absolute;left:14px;bottom:44px;display:flex;flex-direction:column;gap:6px;z-index:2}
  #tools button{width:44px;height:40px;background:var(--solid);border:1px solid var(--line);border-radius:12px;font:700 13px var(--mono);transition:transform .15s,background .2s}
  #tools button:hover{background:var(--solid2);transform:translateX(2px)}
  #ohlc{position:absolute;left:70px;bottom:34px;color:var(--muted);font-size:11px;line-height:1.6;z-index:2;pointer-events:none}
  #ohlc span{color:var(--text);margin-left:6px}
  #zoom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;background:var(--solid);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:2}
  #zoom button{width:42px;height:38px;font-size:20px;transition:background .2s}
  #zoom button:hover{background:var(--solid2)}

  /* trade panel */
  #right{grid-column:3;grid-row:2/4;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .ctl{background:var(--panel2);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;height:58px;flex:none;transition:border-color .2s,box-shadow .2s}
  .ctl:focus-within,.ctl:hover{border-color:rgba(25,240,168,.45)}
  .ctl button{width:44px;height:100%;font-size:20px;color:var(--muted);transition:color .15s,transform .15s}
  .ctl button:hover{color:var(--accent);transform:scale(1.2)}
  .ctl div{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .ctl div b{display:block;font-size:17px;color:var(--text);margin-top:3px;text-transform:none;letter-spacing:0}
  .ctl input{width:100%;background:none;border:0;color:var(--text);font:700 17px var(--mono);text-align:center;outline:none;margin-top:3px;padding:0;text-transform:none;letter-spacing:0}
  .qa{display:flex;gap:6px;flex:none}
  .qa button{flex:1;padding:7px 0;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 12px var(--mono);color:var(--muted);transition:all .15s}
  .qa button:hover{color:#04140c;background:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
  .row{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;flex:none;cursor:pointer;user-select:none;transition:border-color .2s}
  .row:hover{border-color:rgba(124,92,255,.55)}
  .row small{color:var(--muted);font-size:11px;margin-left:6px;font-weight:500}
  .row.dis{color:var(--muted);cursor:not-allowed}
  .sw{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.14);position:relative;flex:none;pointer-events:none;transition:background .25s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .28s cubic-bezier(.3,1.6,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .sw.on{background:linear-gradient(135deg,var(--accent),var(--accent2))} .sw.on::after{transform:translateX(16px)}
  .big{position:relative;overflow:hidden;height:62px;border-radius:16px;font-weight:800;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px;color:#03140c;flex:none;transition:transform .15s,box-shadow .2s,filter .2s}
  #up{background:linear-gradient(135deg,#3af5a6,#14b872);box-shadow:var(--glow-up)}
  #down{background:linear-gradient(135deg,#ff7d96,#ff3a5e);color:#fff;box-shadow:var(--glow-down)}
  .big:hover{transform:translateY(-3px);filter:brightness(1.08)}
  .big:active{transform:scale(.97)}
  .big::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:shine 3.8s infinite}
  #down::after{animation-delay:1.9s}
  .big span{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:20px}
  #up span{animation:bobUp 1.5s ease-in-out infinite}
  #down span{animation:bobDown 1.5s ease-in-out infinite}
  @keyframes bobUp{50%{transform:translateY(-4px)}}
  @keyframes bobDown{50%{transform:translateY(4px)}}
  #profit{flex:none;font-size:12px;color:var(--muted);text-align:center}
  .pf{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(25,240,168,.1),rgba(124,92,255,.1));border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:12px;margin-bottom:4px}
  .pf b{color:var(--up);font-size:14px}
  #trades{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  #trades h4{font-size:11px;color:var(--muted);font-weight:700;margin:6px 0 2px;text-transform:uppercase;letter-spacing:.8px}
  .tr{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:12px;display:grid;grid-template-columns:1fr auto;gap:2px;animation:rise .4s both}
  .tr .d.up{color:var(--up);font-weight:700} .tr .d.down{color:var(--down);font-weight:700}
  .tr .r{text-align:right;font-weight:700}
  .win{color:var(--up)} .loss{color:var(--down)} .tie,.refund,.open{color:var(--muted)}
  .tr small{color:var(--muted)}
  .tr .x{color:var(--down);font-size:12px;text-align:right;font-weight:600}
  .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
  @keyframes ripple{to{transform:scale(4);opacity:0}}

  /* feed */
  #feed{grid-column:2;grid-row:3;display:flex;gap:10px;align-items:center;padding:0 14px;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:600}
  #feed span{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:6px 12px 6px 7px;border-radius:20px;animation:feedIn .5s cubic-bezier(.2,.8,.2,1)}
  #feed .av{width:20px;height:20px;border-radius:50%;display:inline-block}
  #feed .u{color:var(--up)} #feed .d{color:var(--down)}
  @keyframes feedIn{from{opacity:0;transform:translateX(-24px) scale(.9)}to{opacity:1;transform:none}}

  /* toasts + confetti */
  #toast{position:fixed;right:290px;top:90px;display:flex;flex-direction:column;gap:10px;z-index:90}
  .t{position:relative;overflow:hidden;background:var(--solid);border:1px solid var(--line);border-left:4px solid var(--up);padding:12px 16px;border-radius:14px;min-width:220px;animation:toastIn .5s cubic-bezier(.2,1.2,.3,1);box-shadow:0 14px 40px rgba(0,0,0,.4);font-size:12px;color:var(--muted)}
  .t.loss{border-left-color:var(--down)} .t.tie,.t.refund{border-left-color:var(--muted)}
  .t b{display:block;font-size:17px;color:var(--text);margin-top:2px}
  .t::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--up);transform-origin:left;animation:life 3.5s linear forwards}
  .t.loss::after{background:var(--down)} .t.tie::after,.t.refund::after{background:var(--muted)}
  @keyframes toastIn{from{opacity:0;transform:translateX(60px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes life{to{transform:scaleX(0)}}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}

  /* pages */
  #page{display:none;grid-column:2/4;grid-row:2/4;overflow:auto;padding:28px 32px}
  body:not([data-view=home]) #page{display:block}
  body:not([data-view=home]) #chartWrap,body:not([data-view=home]) #right{display:none}
  #page>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  #page>*:nth-child(2){animation-delay:.05s} #page>*:nth-child(3){animation-delay:.1s} #page>*:nth-child(4){animation-delay:.15s} #page>*:nth-child(5){animation-delay:.2s} #page>*:nth-child(6){animation-delay:.25s}
  #page h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
  #page .sub,.sub{color:var(--muted);margin-bottom:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
  button.card:hover{transform:translateY(-4px);border-color:rgba(25,240,168,.5);box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .card small{color:var(--muted);display:block;margin-bottom:5px;font-size:12px}
  .card b{font-size:21px}
  .card .pay+small{padding-right:48px}
  .card .pay{float:right;color:#04140c;background:var(--up);font-weight:800;font-size:11px;padding:3px 8px;border-radius:8px}
  .card svg{width:100%;height:36px;margin-top:10px;display:block}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 13px;font:inherit;transition:border-color .2s,box-shadow .2s}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,240,168,.16);outline:none}
  select option{background:var(--solid)}
  .chip{padding:8px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:600;transition:all .2s}
  .chip:hover{color:var(--text);transform:translateY(-1px)}
  .chip.on{color:#04140c;background:var(--accent);border-color:var(--accent)}
  .btn{position:relative;overflow:hidden;padding:11px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;transition:transform .15s,border-color .2s}
  .btn:hover{border-color:var(--muted);transform:translateY(-1px)}
  .btn.primary{border:0}
  .btn.danger{color:var(--down);border-color:rgba(255,79,112,.35)}
  table{width:100%;border-collapse:collapse;background:var(--panel2);border-radius:16px;overflow:hidden;font-size:13px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody tr{transition:background .15s} tbody tr:hover{background:var(--panel2)}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:rgba(255,255,255,.04)}
  td.up{color:var(--up)} td.down{color:var(--down)}
  .empty{padding:36px;text-align:center;color:var(--muted)}
  .tw{overflow:auto;border-radius:16px}
  .form{display:grid;gap:12px;max-width:460px;margin-bottom:28px}
  .form h3,.sect h3{font-size:15px;margin-bottom:2px}
  label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
  label input,label select{color:var(--text);font-size:14px;font-weight:400}
  label.inl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text)}
  label.inl input{width:auto}
  details{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;max-width:780px;transition:border-color .2s}
  details[open]{border-color:rgba(25,240,168,.4)}
  summary{cursor:pointer;font-weight:700}
  details p{margin-top:10px;color:var(--muted);line-height:1.6;animation:rise .35s both}
  kbd{background:var(--solid);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:12px var(--mono)}
  .sect{margin-bottom:28px}
  .note{color:var(--muted);font-size:12px;max-width:640px;line-height:1.55}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(4,5,12,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  #modal.open{display:flex}
  #modalBox{background:var(--solid);border:1px solid var(--line);border-radius:22px;padding:26px;width:min(430px,100%);max-height:92vh;overflow:auto;display:grid;gap:12px;position:relative;animation:pop .25s cubic-bezier(.2,1.1,.3,1);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #modalBox h2{font-size:21px}
  #modalBox form{display:grid;gap:12px}
  #modalBox .close{position:absolute;right:14px;top:12px;font-size:24px;color:var(--muted);transition:transform .2s}
  #modalBox .close:hover{transform:rotate(90deg);color:var(--text)}
  .err{color:var(--down);font-size:13px;min-height:16px}
  .seg{display:flex;background:var(--panel2);border-radius:12px;padding:4px}
  .seg button{flex:1;padding:9px;border-radius:9px;color:var(--muted);font-weight:600;transition:all .2s}
  .seg button.on{background:var(--solid2);color:var(--text);box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .tx small{display:block;color:var(--muted)}

  /* splash / loading */
  #splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 30% 25%,rgba(124,92,255,.35),transparent 45%),radial-gradient(circle at 75% 80%,rgba(25,240,168,.25),transparent 45%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .6s,visibility .6s,transform .6s}
  #splash.done{opacity:0;visibility:hidden;transform:scale(1.04)}
  .mark{position:relative;width:88px;height:88px;border-radius:26px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#04140c;font-weight:900;font-size:34px;animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 70px rgba(124,92,255,.5)}
  #splash .mark::before{content:"";position:absolute;inset:-14px;border-radius:36px;border:2px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent2);animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.06)}}
  #splash h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
  #splash h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}
  .ldBar{width:260px;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .ldBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s ease-out;box-shadow:0 0 14px var(--accent)}
  #ldMsg{color:var(--muted);font-size:13px;height:16px}

  /* login page */
  #authPage{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 85% 15%,rgba(124,92,255,.28),transparent 45%),radial-gradient(circle at 95% 95%,rgba(25,240,168,.2),transparent 45%),var(--bg);display:none;grid-template-columns:1.1fr 1fr;overflow:auto}
  #authPage.open{display:grid}
  .aBrand,.aBrand h2{color:#eef0ff}
  .aBrand{position:relative;overflow:hidden;background:radial-gradient(circle at 25% 20%,#3a2a8f 0,#161236 50%,#0a0a1c 100%);padding:56px;display:flex;flex-direction:column;justify-content:center;gap:20px}
  .aBrand .mark{width:56px;height:56px;border-radius:16px;font-size:22px;animation:float 4s ease-in-out infinite;box-shadow:0 10px 30px rgba(25,240,168,.3)}
  .aBrand h2{font-size:38px;line-height:1.12;max-width:440px;font-weight:800;letter-spacing:-.02em}
  .aBrand h2 span{background:linear-gradient(90deg,#19f0a8,#9d86ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .aBrand ul{list-style:none;display:grid;gap:12px;color:#c4c8ea;max-width:420px}
  .aBrand li{animation:rise .6s both} .aBrand li:nth-child(2){animation-delay:.1s} .aBrand li:nth-child(3){animation-delay:.2s} .aBrand li:nth-child(4){animation-delay:.3s}
  .aBrand li::before{content:"✓";color:#04140c;background:var(--accent);width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;margin-right:10px}
  .aBrand svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;opacity:.5;pointer-events:none}
  .aBrand svg line,.aBrand svg rect{transform-box:fill-box;transform-origin:center;animation:flick 3.2s ease-in-out infinite}
  @keyframes flick{50%{transform:scaleY(1.35)}}
  .aForm{display:flex;align-items:center;justify-content:center;padding:32px}
  .aCard{width:min(410px,100%);display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:34px;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:rise .7s .1s cubic-bezier(.2,.8,.2,1) both}
  .aCard h1{font-size:27px;font-weight:800;letter-spacing:-.02em}
  .aCard form{display:grid;gap:14px}
  .pw{position:relative}
  .pw input{width:100%;padding-right:62px}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;padding:6px 8px;font-weight:600}
  .aCard .btn{padding:13px;font-size:15px}
  .aCard .btn[disabled]{opacity:.6;cursor:wait}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
  .aCard .alt{color:var(--muted);text-align:center;font-size:13px}

  /* light theme */
  :root[data-theme=light]{--bg:#eceffd;--panel:rgba(255,255,255,.7);--panel2:rgba(26,32,88,.06);--solid:#ffffff;--solid2:#eef0fb;--line:rgba(30,36,90,.1);--text:#161a3a;--muted:#646a8c;--up:#0fb872;--down:#e83a5d;--accent:#0fbf84;--accent2:#6a4cf0;--glow-up:0 10px 26px rgba(15,184,114,.28);--glow-down:0 10px 26px rgba(232,58,93,.28)}
  :root[data-theme=light] body::before{opacity:.2}
  :root[data-theme=light] body::after{opacity:.16}
  :root[data-theme=light] .sw{background:rgba(30,36,90,.18)}
  :root[data-theme=light] .menu,:root[data-theme=light] .t,:root[data-theme=light] #modalBox{box-shadow:0 18px 44px rgba(30,36,90,.18)}
  :root[data-theme=light] th{background:rgba(30,36,90,.04)}
  :root[data-theme=light] .qa button:hover,:root[data-theme=light] .chip.on{color:#04140c}

  /* single UI style: Amber (below) */

  /* amber skin: warm dark glass dashboard, black pill sidebar, soft large cards */
  :root[data-skin=amber]{--bg:#131015;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.09);--solid:#2b2529;--solid2:#383034;--line:rgba(255,255,255,.08);--text:#f7f2ef;--muted:#aaa09c;--up:#c6f27a;--down:#ff8a5c;--accent:#f4d03f;--accent2:#e8743b;--glow-up:0 10px 28px rgba(198,242,122,.2);--glow-down:0 10px 28px rgba(255,138,92,.24);--r:28px;--font:'Sora','Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif}
  :root[data-skin=amber][data-theme=light]{--bg:#efe6df;--panel:rgba(255,255,255,.6);--panel2:rgba(60,40,30,.07);--solid:#fffaf6;--solid2:#f3e9e2;--line:rgba(60,40,30,.1);--text:#2a2024;--muted:#7d6e6a;--up:#5f9e1c;--down:#e0592a;--accent:#d49b00;--accent2:#e8743b;--glow-up:0 10px 26px rgba(95,158,28,.22);--glow-down:0 10px 26px rgba(224,89,42,.22)}
  :root[data-skin=amber] body::before{opacity:.42;background:var(--accent2);left:18vmax;top:-22vmax}
  :root[data-skin=amber] body::after{opacity:.16;background:var(--accent);right:-18vmax;bottom:-24vmax}
  :root[data-skin=amber] #app{gap:14px;padding:16px}
  :root[data-skin=amber] #side{background:#0b0a0d;border-color:rgba(255,255,255,.05);border-radius:32px;backdrop-filter:none}
  :root[data-skin=amber][data-theme=light] #side{background:#1b1519}
  :root[data-skin=amber] #side,:root[data-skin=amber] #side .nav{color:#d8cfcb}
  :root[data-skin=amber] .nav{border-radius:16px;color:#9b918d}
  :root[data-skin=amber] .nav.on{background:rgba(255,255,255,.13);color:#fff}
  :root[data-skin=amber] .nav.on::before{display:none}
  :root[data-skin=amber] #logo,:root[data-skin=amber] .mark{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1c1206;border-radius:16px;box-shadow:0 8px 24px rgba(232,116,59,.4)}
  :root[data-skin=amber] #top{border-radius:32px}
  :root[data-skin=amber] #chartWrap,:root[data-skin=amber] #right,:root[data-skin=amber] #feed,:root[data-skin=amber] #page{border-radius:32px;border-color:rgba(255,255,255,.06)}
  :root[data-skin=amber] .tab,:root[data-skin=amber] .chip,:root[data-skin=amber] #themeBtn{border-radius:999px}
  :root[data-skin=amber] .tab.on{background:rgba(255,255,255,.14);color:var(--text)}
  :root[data-skin=amber] #pay{background:#fff;color:#141116;border-radius:999px;box-shadow:0 6px 20px rgba(255,255,255,.12)}
  :root[data-skin=amber] #pay::after{display:none}
  :root[data-skin=amber] .btn.primary{background:linear-gradient(135deg,#f7dc5a,#f08a3c);color:#1c1206;border-radius:999px;box-shadow:0 8px 22px rgba(240,138,60,.3)}
  :root[data-skin=amber] #avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1c1206;border-radius:50%}
  :root[data-skin=amber] .big{height:58px;border-radius:999px}
  :root[data-skin=amber] #up{background:var(--up);color:#16210a;box-shadow:var(--glow-up)}
  :root[data-skin=amber] #down{background:var(--down);color:#2a0f04;box-shadow:var(--glow-down)}
  :root[data-skin=amber] .big::after{display:none}
  :root[data-skin=amber] .big span{background:rgba(0,0,0,.16);border-radius:50%}
  :root[data-skin=amber] .sw.on{background:var(--accent)}
  :root[data-skin=amber] .pf{background:var(--panel2);border-radius:20px}
  :root[data-skin=amber] #lastPx{border-radius:999px;box-shadow:none;border-color:var(--line)}
  :root[data-skin=amber] .ldBar i{background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent2)}
  :root[data-skin=amber] #splash h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));background-size:200% 100%;-webkit-background-clip:text;background-clip:text}
  :root[data-skin=amber] #authPage{background:radial-gradient(circle at 80% 10%,rgba(232,116,59,.3),transparent 45%),radial-gradient(circle at 10% 100%,rgba(244,208,63,.14),transparent 45%),var(--bg)}
  :root[data-skin=amber] .aBrand{background:radial-gradient(circle at 25% 20%,#8d4521 0,#2b1a18 48%,#0f0c11 100%)}
  :root[data-skin=amber] .aBrand h2 span{background:linear-gradient(90deg,#f7dc5a,#f08a3c);-webkit-background-clip:text;background-clip:text}
  :root[data-skin=amber] .aCard{border-radius:32px}
  :root[data-skin=amber] .aBrand li::before{background:var(--accent);color:#1c1206}

  /* trading background art */
  #bgArt{position:fixed;inset:0;z-index:0;pointer-events:none}
  #bgArt svg{width:100%;height:100%;display:block}
  #bgArt .bgDrift{animation:bgdrift 50s ease-in-out infinite alternate}
  #bgArt .bgFloat{animation:bgfloat 14s ease-in-out infinite alternate}
  #bgArt .bgPing{transform-box:fill-box;transform-origin:center;animation:bgping 2.4s ease-out infinite}
  @keyframes bgdrift{to{transform:translateX(-46px)}}
  @keyframes bgfloat{to{transform:translateY(-26px) rotate(4deg)}}
  @keyframes bgping{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
  :root[data-theme=light] #bgArt{opacity:.8}
  @media (prefers-reduced-motion:reduce){#bgArt *{animation:none!important}}
  :root[data-skin=amber] #top,:root[data-skin=amber] #right,:root[data-skin=amber] #feed,:root[data-skin=amber] #page{backdrop-filter:blur(7px) saturate(140%);-webkit-backdrop-filter:blur(7px) saturate(140%)}
  :root[data-skin=amber] #chartWrap{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(18,14,20,.42)}
  body.authing #app{visibility:hidden}
  /* collapsible sidebar */
  #sbBtn{width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none;transition:transform .25s,background .2s}
  #sbBtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  #sbBtn:hover{background:var(--solid2)}
  #app{transition:grid-template-columns .38s cubic-bezier(.2,.8,.2,1)}
  #side{transition:opacity .25s,transform .38s cubic-bezier(.2,.8,.2,1),padding .38s}
  body.sb-off #app{grid-template-columns:0px 1fr 264px}
  body.sb-off #side{opacity:0;pointer-events:none;padding:0;border-width:0;transform:translateX(-24px);overflow:hidden;min-width:0}
  body.sb-off #sbBtn{transform:rotate(180deg)}
  :root[data-skin=amber] #chartWrap{background:rgba(18,14,20,.5)}
  :root[data-skin=amber][data-theme=light] #chartWrap{background:rgba(255,250,246,.72)}
  :root[data-skin=amber][data-theme=light] .tab.on{background:#fff;color:var(--text);box-shadow:0 4px 14px rgba(60,40,30,.12)}
  :root[data-skin=amber] #online{color:#a89d99} :root[data-skin=amber] #online b{color:#fff}
  :root[data-skin=amber] #authPage{background:linear-gradient(rgba(19,16,21,.35),rgba(19,16,21,.35))}
  :root[data-skin=amber][data-theme=light] #authPage{background:rgba(239,230,223,.4)}
  :root[data-skin=amber] .aForm{background:rgba(19,16,21,.35);backdrop-filter:blur(6px)}
  :root[data-skin=amber][data-theme=light] .aForm{background:rgba(255,250,246,.5)}

  #banner{display:none;position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:90;max-width:min(720px,94vw);padding:8px 18px;border-radius:0 0 10px 10px;font-weight:600;font-size:13px;background:var(--accent2);color:#fff;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  #banner.on{display:block} #banner.warn{background:#d98a00} #banner.alert{background:var(--down)}
  #maint{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);place-items:center;text-align:center;padding:24px}
  #maint.on{display:grid} #maint h2{font-size:28px;margin:18px 0 8px} #maint p{color:var(--muted);max-width:420px;margin:0 auto;line-height:1.5} #maint .mark{margin:0 auto}

  /* icon-only rail sidebar */
  #app{grid-template-columns:68px 1fr 264px}
  #side{padding:18px 0;gap:10px;align-items:center;z-index:30;overflow:visible}
  .nav{width:46px!important;height:46px;padding:0!important;gap:0;justify-content:center;font-size:0!important;border-radius:15px;position:relative}
  .nav svg{width:22px;height:22px}
  .nav.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#fff}
  .nav.on::before{display:none}
  .nav::after{content:attr(data-tip);position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-6px);padding:6px 11px;border-radius:9px;background:#fff;color:#141116;font-size:12px;font-weight:700;font-family:var(--font);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .nav:hover::after{opacity:1;transform:translateY(-50%)}
  #logo{margin-bottom:10px}
  #online{margin-top:auto;margin-bottom:4px}
  #online b{font-size:11px}
  #navProfile{margin-top:2px}
  body.sb-off #side{overflow:hidden}

  /* CFD terminal */
  .xt,.xcalc{--xm:'JetBrains Mono',ui-monospace,Consolas,monospace}
  .xsub{max-width:680px;margin-bottom:18px}
  .xt{display:grid;gap:14px}
  .xt input,.xt select,#page .xg input,#page .xg select,#xBody .bar select,#xBody .xcards select{width:100%;background:var(--solid);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--text);font:inherit;outline:none}
  .xt input:focus,.xt select:focus,#page .xg input:focus,#page .xg select:focus{border-color:var(--accent)}
  .xt-acc{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
  .xt-acc select{width:290px;max-width:100%;margin-right:10px}
  .xt-acc,.xt-list,.xt-chart,.xt-order,.xt-bot,.xtype{background:color-mix(in srgb,var(--solid) 86%,transparent)}
  .xt-order .xnum button,.xt input,.xt select{background:var(--solid2)}
  .xbt button{white-space:nowrap}
  .xs{min-width:104px;padding:2px 14px;border-left:1px solid var(--line)}
  .xs small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .xs b{font:700 15px var(--xm)}
  .xt-main{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:14px;align-items:stretch}
  .xt-list,.xt-chart,.xt-order,.xt-bot{background:var(--panel2);border:1px solid var(--line);border-radius:16px;min-width:0}
  .xt-list{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:470px}
  #xL{overflow:auto;display:grid;gap:4px;align-content:start}
  .xrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;text-align:left;font-weight:600;font-size:13px;border:1px solid transparent}
  .xrow small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .xrow:hover{background:var(--solid2)} .xrow.on{background:var(--solid2);border-color:var(--accent)}
  .xp{display:grid;text-align:right;font:600 12px var(--xm)} .xp .xb{color:var(--down)} .xp .xa{color:var(--accent2)}
  .xrow.fu .xb{animation:xfu .6s} .xrow.fd .xb{animation:xfd .6s}
  @keyframes xfu{from{color:var(--up);transform:translateY(-2px)}} @keyframes xfd{from{color:var(--down);transform:translateY(2px)}}
  .xt-chart{padding:12px 12px 6px;display:flex;flex-direction:column;gap:8px}
  .xt-head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .xt-head b{font:700 17px var(--xm);display:block} .xt-head small{color:var(--muted);font-size:11px}
  .xhp{margin-left:auto}
  #xCv{width:100%;height:370px;display:block}
  .xt-order{padding:14px;display:grid;gap:10px;align-content:start}
  .xt-order label{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
  .xt-order .chips{display:flex;gap:6px;flex-wrap:wrap} .xt-order .chip{padding:5px 10px;font-size:12px;color:var(--text)}
  .xot{margin-bottom:2px}
  .xbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .xsell,.xbuy{display:grid;gap:2px;padding:12px 8px;border-radius:12px;color:#fff;font-weight:700;text-align:center;transition:filter .15s,transform .15s}
  .xsell{background:var(--down)} .xbuy{background:var(--up);color:#04140c}
  .xsell small,.xbuy small{font-size:11px;opacity:.85;font-weight:700} .xsell b,.xbuy b{font:700 15px var(--xm)}
  .xsell:hover,.xbuy:hover{filter:brightness(1.1);transform:translateY(-2px)} .xsell:active,.xbuy:active{transform:scale(.97)}
  .xnum{display:grid;grid-template-columns:38px 1fr 38px;gap:6px} .xnum button{border-radius:10px;background:var(--solid);border:1px solid var(--line);font-size:18px} .xnum input{text-align:center;font:700 14px var(--xm)}
  .xinfo{display:grid;gap:6px;font-size:12px;border-top:1px solid var(--line);padding-top:10px}
  .xinfo div{display:flex;justify-content:space-between;gap:10px} .xinfo span{color:var(--muted)} .xinfo b{font-family:var(--xm)}
  .xt-bot{padding:12px}
  .xbh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px} .xbt{min-width:340px}
  .xact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .xb2{padding:5px 11px;margin-left:5px;border-radius:8px;background:var(--solid);border:1px solid var(--line);font-size:12px;font-weight:600;transition:border-color .15s}
  .xact .xb2{margin-left:0} .xb2:hover{border-color:var(--muted)}
  .xtot{padding:10px 4px 0;color:var(--muted);font-size:12px}
  .xcards{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .xacc.cur{border-color:var(--accent)} .xrowb{display:flex;gap:6px;flex-wrap:wrap} .xrowb .btn{padding:7px 12px;font-size:12px}

"use strict";
// =====================================================================
// config

const ASSETS = {
  "Asia Composite Index": {cat:"Index",     base:6212.5,  vol:0.09,    pay:.85, dec:4},
  "EUR/USD":              {cat:"Forex",     base:1.0850,  vol:0.00006, pay:.82, dec:5},
  "GBP/USD":              {cat:"Forex",     base:1.2700,  vol:0.00007, pay:.81, dec:5},
  "USD/JPY":              {cat:"Forex",     base:149.50,  vol:0.008,   pay:.80, dec:3},
  "Gold":                 {cat:"Commodity", base:2650.0,  vol:0.35,    pay:.80, dec:2},
  "Tech Index":           {cat:"Index",     base:18430.0, vol:0.9,     pay:.78, dec:2},
  "Apple":                {cat:"Stocks",    base:230.0,   vol:0.05,    pay:.76, dec:2},
  "Tesla":                {cat:"Stocks",    base:250.0,   vol:0.09,    pay:.74, dec:2},
  "Bitcoin":              {cat:"Crypto",    base:68000.0, vol:12,      pay:.79, dec:1},
};
const TFS = [5,15,30,60];
const ALL_DURS = [5,15,30,60,180,300];
let DURS = ALL_DURS.slice();
const STARTS = {demo:50000, practice:100000};
const ACCT_NAMES = {demo:"Demo account", practice:"Practice account"};
const HIST = 220;
let RF_MAX_STAKE = 20, RF_PER_DAY = 3, ORDER_TTL = 5*60*1000;

// =====================================================================
// helpers
// =====================================================================
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const round2 = n => Math.round(n*100)/100;
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDur = s => s<60 ? s+"s" : (s/60)+"m";
const fmtMoney = n => "AED " + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const decOf = n => ASSETS[n].dec ?? 4;
const STATUS = {open:"Open",win:"Won",loss:"Lost",tie:"Draw",refund:"Refunded"};
async function hash(s){
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ts:"+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=5381; for(const ch of "ts:"+s) h=((h<<5)+h+ch.charCodeAt(0))|0; return "d"+h;

function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function advance(m,a,dt){
  const v=a.vol*(a.volx||1);
  m.drift = m.drift*0.97 + gauss()*v*0.08;
  m.price += gauss()*v*Math.sqrt(dt) + m.drift + (a.base-m.price)*0.0008;
}
function seedAll(){
  const now = Date.now();
  for(const n in ASSETS){
    const a=ASSETS[n], m = M[n] = M[n] || {price:a.base,drift:0,spark:[]};
    const keep = m.seeded ? m.price : null;   // timeframe change must not move the live price
    m.price=a.base; m.drift=0;
    const list=[], t0=Math.floor(now/1000/S.tf)*S.tf*1000 - HIST*S.tf*1000;
    for(let i=0;i<HIST;i++){
      const c={t:t0+i*S.tf*1000,o:m.price,h:m.price,l:m.price,c:m.price};
      for(let k=0;k<8;k++){ advance(m,a,S.tf/8); c.h=Math.max(c.h,m.price); c.l=Math.min(c.l,m.price); }
      c.c=m.price; list.push(c);
    }
    if(keep!=null){ const d=keep-m.price; for(const c of list){c.o+=d;c.h+=d;c.l+=d;c.c+=d;} m.price=keep; }
    m.seeded=true;
    C[n]=list; m.spark=list.slice(-60).map(c=>c.c);
  }
}
function pushCandle(list,price,now){
  const slot=Math.floor(now/1000/S.tf)*S.tf*1000, tfms=S.tf*1000;
  let last=list[list.length-1];
  if(last.t<slot){
    while(last.t+tfms<slot){ last={t:last.t+tfms,o:last.c,h:last.c,l:last.c,c:last.c}; list.push(last); }
    last={t:slot,o:last.c,h:price,l:price,c:price}; list.push(last);
    if(list.length>2000) list.splice(0,500);
  }
  last.c=price; last.h=Math.max(last.h,price); last.l=Math.min(last.l,price);
}
let sparkN=0;
function tick(){
  const now=Date.now(); sparkN++;
  for(const n in ASSETS){
    const m=M[n]; advance(m,ASSETS[n],0.25); pushCandle(C[n],m.price,now);
    if(sparkN%4===0){ m.spark.push(m.price); if(m.spark.length>60) m.spark.shift(); }
  }
  if(DB.session && !U()) kickOut("Your account is no longer available.");
  else if(U() && U().suspended) kickOut("Your account has been suspended. Contact support.");
  else if(U()){ fillOrders(now); settle(now); cfdTick(now); }
  updateOHLC(); updateLastPx();
  if(S.view==="market" && sparkN%4===0) fillMarket();
  if(S.view==="hub") hubLive();
}

function place(dir){
  const u=U(); if(!u) return showAuth();
  if(CFG.maintenance) return toast("Trading is paused for maintenance","loss","Maintenance");
  if(ASSETS[S.asset].off) return toast("This asset is currently unavailable","loss","Rejected");
  const amt=S.amt;
  if(!(amt>0)) return toast("Enter a valid amount","tie","Invalid");
  if(amt<CFG.minStake) return toast("Minimum stake is AED "+CFG.minStake,"loss","Rejected");
  if(amt>CFG.maxStake) return toast("Maximum stake is AED "+CFG.maxStake,"loss","Rejected");
  if(amt>bal()) return toast("Insufficient balance. Open Payments to add funds.","loss","Rejected");
  if(S.rf){
    if(!CFG.rfOn) return toast("Risk-free is disabled","loss","Risk-free");
    if(amt>RF_MAX_STAKE) return toast("Risk-free max stake is AED "+RF_MAX_STAKE,"loss","Risk-free");
    if(rfLeft()<=0) return toast("No risk-free trades left today","loss","Risk-free");
  }
  const o={id:uid(),dir,amt,asset:S.asset,dur:DURS[S.durIdx],acct:u.acct,rf:S.rf};
  if(S.order){
    if(!CFG.orderOn) return toast("Orders are disabled","loss","Order");
    if(S.orderLevel==null) return toast("Click the chart to choose the target price","tie","Order");
    const p=M[S.asset].price;
    o.level=S.orderLevel; o.side=Math.sign(o.level-p); o.created=Date.now(); o.expires=o.created+ORDER_TTL;
    addBal(u.acct,-amt); u.pending.push(o);
    toast(`${dir==="up"?"Up":"Down"} order @ ${o.level.toFixed(dec())}`,"tie","Order placed");
  }else{
    addBal(u.acct,-amt); startTrade(o,p0(o.asset));
  }
  if(S.rf){ u.rf.used++; S.rf=false; }
  persist(); renderBal(); renderTrades(); renderToggles();
}
const p0 = n => M[n].price;
function startTrade(o,entry){
  const u=U(), now=Date.now();
  u.trades.unshift({id:uid(),dir:o.dir,amt:o.amt,entry,asset:o.asset,pay:ASSETS[o.asset].pay,
    start:now,end:now+o.dur*1000,status:"open",dur:o.dur,acct:o.acct,rf:!!o.rf});
  if(u.trades.length>500) u.trades.pop();
}
function fillOrders(now){
  const u=U(); let changed=false;
  for(const o of [...u.pending]){
    const p=M[o.asset].price;
    if(now>o.expires){
      u.pending.splice(u.pending.indexOf(o),1); addBal(o.acct,o.amt); changed=true;
      toast("Order expired, stake returned","tie","Order"); continue;
    }
    if((o.side>=0 && p>=o.level) || (o.side<0 && p<=o.level)){
      u.pending.splice(u.pending.indexOf(o),1); startTrade(o,p); changed=true;
      toast(`${o.asset} reached ${o.level.toFixed(decOf(o.asset))}`,"tie","Order filled");
    }
  }
  if(changed){ persist(); renderBal(); renderTrades(); if(S.view==="trades") fillTrades(); }
}
function cancelOrder(id){
  const u=U(), i=u.pending.findIndex(o=>o.id===id); if(i<0) return;
  const o=u.pending.splice(i,1)[0]; addBal(o.acct,o.amt);
  persist(); renderBal(); renderTrades(); toast("Stake returned","tie","Order cancelled");
}
function settle(now){
  let changed=false;
  for(const t of T()){
    if(t.status!=="open" || now<t.end) continue;
    const px=M[t.asset].price; t.close=px;
    if(px===t.entry){ t.status="tie"; t.result=0; addBal(t.acct,t.amt); }
    else if(t.dir==="up" ? px>t.entry : px<t.entry){
      t.status="win"; t.result=round2(t.amt*t.pay); addBal(t.acct,t.amt+t.result);
    }else if(t.rf){ t.status="refund"; t.result=0; addBal(t.acct,t.amt); }
    else{ t.status="loss"; t.result=-t.amt; }
    const m = {win:["Trade won","+"+fmtMoney(t.result),""], loss:["Trade lost","−"+fmtMoney(t.amt),"loss"],
               tie:["Draw","Refunded "+fmtMoney(t.amt),"tie"], refund:["Risk-free refund","Refunded "+fmtMoney(t.amt),"refund"]}[t.status];
    toast(m[1],m[2],m[0]);
    if(t.status==="win"){ beep(660,880); confetti(); } else if(t.status==="loss") beep(300,180);
    changed=true;
  }
  if(changed){ persist(); renderBal(); renderTrades(); if(S.view==="trades") fillTrades(); if(S.view==="profile") renderPage(); }
}
function stats(list){
  const closed=list.filter(t=>t.status!=="open");
  const wins=closed.filter(t=>t.status==="win").length, decided=closed.filter(t=>t.status==="win"||t.status==="loss").length;
  return {n:list.length, rate:decided?wins/decided*100:0, net:round2(closed.reduce((s,t)=>s+(t.result||0),0)), vol:round2(list.reduce((s,t)=>s+t.amt,0))};
}
let AC=null;
function beep(f1,f2){
  if(!U()||!U().settings.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.connect(g); g.connect(AC.destination); o.frequency.setValueAtTime(f1,t); o.frequency.setValueAtTime(f2,t+.12);
    g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.start(t); o.stop(t+.3);
  }catch(e){}
}

function doWallet(ev,type){
  ev.preventDefault();
  const amt=round2(parseFloat($("w_amt").value)), err=m=>$("w_err").textContent=m;
  if(!(amt>0)) return err("Enter an amount greater than 0.");
  if(amt<1) return err("Minimum is AED 1.");
  if(amt>CFG.txMax) return err("Maximum is AED "+CFG.txMax.toLocaleString()+" per transaction.");
  if(type==="deposit" && !CFG.depositOn) return err("Deposits are currently disabled.");
  if(type==="withdraw" && !CFG.withdrawOn) return err("Withdrawals are currently disabled.");
  const u=U();
  if(type==="withdraw" && amt>bal()) return err("Amount exceeds your available balance.");
  const d=type==="deposit"?amt:-amt;
  addBal(u.acct,d); addTx(type,d,u.acct,$("w_m").value.replace(" (simulated)",""));
  persist(); renderBal(); renderWallet();
  toast((d>0?"+":"−")+fmtMoney(amt),d>0?"":"tie",type==="deposit"?"Deposit successful":"Withdrawal successful");
}

// =====================================================================
// CFD / Forex terminal (Exness-style): trading accounts, leverage, lots, margin,
// SL/TP, pending orders, stop-out, calculator, economic calendar, copy trading
// =====================================================================
const USD_AED=3.6725;
const INST={   // cs = contract size, pip = pip size, sp = typical spread (price units), ub = quote currency is not USD
  "EUR/USD":{cs:100000,pip:.0001,sp:.00012,cat:"Forex"},
  "GBP/USD":{cs:100000,pip:.0001,sp:.00016,cat:"Forex"},
  "USD/JPY":{cs:100000,pip:.01,sp:.013,cat:"Forex",ub:true},
  "Gold":{cs:100,pip:.1,sp:.25,cat:"Metals"},
  "Bitcoin":{cs:1,pip:1,sp:35,cat:"Crypto"},
  "Apple":{cs:100,pip:.01,sp:.08,cat:"Stocks"},
  "Tesla":{cs:100,pip:.01,sp:.12,cat:"Stocks"},
  "Asia Composite Index":{cs:10,pip:.1,sp:1.2,cat:"Indices"},
  "Tech Index":{cs:1,pip:1,sp:2.5,cat:"Indices"},
};
const ATYPES={
  standard:{name:"Standard",sx:1,comm:0,desc:"Spreads from 0.3 pips. No commission. The best choice to start."},
  pro:{name:"Pro",sx:.45,comm:0,desc:"Tighter spreads and no commission. Instant execution."},
  zero:{name:"Zero",sx:.03,comm:3,desc:"Near-zero spreads on every instrument. Small commission per lot."},
  raw:{name:"Raw Spread",sx:.1,comm:3.5,desc:"Raw market spreads. Fixed commission per lot, per side."},
};
const LEVS=[1,5,10,25,50,100,200,500,1000,2000];
const TS={sub:"terminal",sym:"EUR/USD",otype:"market",lots:.01,sl:"",tp:"",price:"",bot:"pos",q:"",osig:"",psig:"",newType:"standard",newLev:100,newBal:10000,imp:0,cur:"all"};
const MC={};
const fmtUsd=n=>(n<0?"−":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sgnUsd=n=>(n>0?"+":"")+fmtUsd(n);
const num=v=>{ const x=parseFloat(v); return isFinite(x)?x:null; };
const cfdD=()=>{ const u=U(); if(!u.cfd||!u.cfd.accts) u.cfd={accts:[],cur:null,pos:[],ord:[],hist:[],copy:[]}; if(!u.cfd.copy) u.cfd.copy=[]; return u.cfd; };
const cfdAcct=()=>{ const c=cfdD(); return c.accts.find(a=>a.id===c.cur)||c.accts[0]||null; };
const instList=()=>Object.keys(INST).filter(n=>ASSETS[n]&&!ASSETS[n].off);
const idec=n=>ASSETS[n].dec;
const levOpts=cur=>LEVS.filter(l=>l<=CFG.cfdMaxLev||l===cur);

function quote(sym,type){ const m=M[sym].price, h=INST[sym].sp*ATYPES[type].sx/2; return {bid:m-h,ask:m+h}; }
function pnl(p,q){ const i=INST[p.sym], d=p.side==="buy"?q.bid-p.open:p.open-q.ask, r=d*p.lots*i.cs; return i.ub?r/M[p.sym].price:r; }
function marginOf(sym,lots,lev){ const i=INST[sym]; return lots*i.cs*(i.ub?1:M[sym].price)/lev; }
function pipVal(sym,lots){ const i=INST[sym]; return i.pip*i.cs*lots/(i.ub?M[sym].price:1); }
function accStats(a){
  const c=cfdD(); let fl=0, mg=0;
  for(const p of c.pos){ if(p.acct!==a.id) continue; fl+=pnl(p,quote(p.sym,a.type)); mg+=p.margin; }
  const eq=a.bal+fl; return {fl,mg,eq,free:eq-mg,lvl:mg>0?eq/mg*100:null};
}
function cfdCheck(sym,side,lots,sl,tp,entry){
  if(!CFG.cfdOn) return "The CFD terminal is currently disabled.";
  if(CFG.maintenance) return "Trading is paused for maintenance.";
  if(!INST[sym]||ASSETS[sym].off) return "This instrument is unavailable.";
  if(!(lots>=.01)) return "Minimum volume is 0.01 lot.";
  if(lots>CFG.cfdMaxLots) return "Maximum volume is "+CFG.cfdMaxLots+" lots.";
  if(Math.abs(lots*100-Math.round(lots*100))>1e-6) return "Volume step is 0.01 lot.";
  const g=INST[sym].pip, d=idec(sym), buy=side==="buy";
  if(sl!=null&&(buy?sl>entry-g:sl<entry+g)) return "Invalid stop loss. For a "+side+" it must be "+(buy?"below ":"above ")+(buy?entry-g:entry+g).toFixed(d)+".";
  if(tp!=null&&(buy?tp<entry+g:tp>entry-g)) return "Invalid take profit. For a "+side+" it must be "+(buy?"above ":"below ")+(buy?entry+g:entry-g).toFixed(d)+".";
  return "";
}
function marginErr(a,sym,lots){
  const need=marginOf(sym,lots,a.lev)+lots*ATYPES[a.type].comm, st=accStats(a);
  return st.free<need?"Not enough free margin. Required "+fmtUsd(need)+", available "+fmtUsd(st.free)+".":"";
}
function openPos(a,sym,side,lots,sl,tp,price){
  const c=cfdD(), comm=round2(lots*ATYPES[a.type].comm);
  a.bal=round2(a.bal-comm);
  const p={id:uid(),acct:a.id,sym,side,lots,open:price,sl,tp,t:Date.now(),comm,margin:marginOf(sym,lots,a.lev)};
  c.pos.unshift(p); return p;
}
function closePos(p,reason,at){
  const c=cfdD(), a=c.accts.find(x=>x.id===p.acct); if(!a) return 0;
  const q=at!=null?{bid:at,ask:at}:quote(p.sym,a.type), cp=p.side==="buy"?q.bid:q.ask;
  const gross=pnl(p,q), comm=round2(p.lots*ATYPES[a.type].comm), net=round2(gross-comm-p.comm);
  a.bal=round2(a.bal+gross-comm); if(a.bal<0) a.bal=0;
  c.pos.splice(c.pos.indexOf(p),1);
  c.hist.unshift({id:p.id,acct:p.acct,sym:p.sym,side:p.side,lots:p.lots,open:p.open,close:cp,t:p.t,tc:Date.now(),profit:round2(gross),comm:round2(comm+p.comm),net,reason});
  if(c.hist.length>300) c.hist.length=300;
  hubBenAccrue(a,p.lots);
  return net;
}
function cfdTick(now){
  const u=U(), c=u.cfd; if(!c) return;
  let changed=false;
  if(c.ord.length||c.pos.length){
    for(const o of [...c.ord]){
      const a=c.accts.find(x=>x.id===o.acct); if(!a){ c.ord.splice(c.ord.indexOf(o),1); changed=true; continue; }
      const q=quote(o.sym,a.type), buy=o.side==="buy", px=buy?q.ask:q.bid;
      const hit=o.kind==="limit"?(buy?px<=o.price:px>=o.price):(buy?px>=o.price:px<=o.price);
      if(!hit) continue;
      c.ord.splice(c.ord.indexOf(o),1); changed=true;
      const e=cfdCheck(o.sym,o.side,o.lots,o.sl,o.tp,px)||marginErr(a,o.sym,o.lots);
      if(e) toast(o.sym+": "+e,"loss","Pending order cancelled");
      else{ openPos(a,o.sym,o.side,o.lots,o.sl,o.tp,px); toast(`${o.side==="buy"?"Buy":"Sell"} ${o.kind} ${o.lots} ${o.sym} @ ${px.toFixed(idec(o.sym))}`,"tie","Pending order filled"); beep(600,800); }
    }
    for(const p of [...c.pos]){
      const a=c.accts.find(x=>x.id===p.acct); if(!a) continue;
      const q=quote(p.sym,a.type), buy=p.side==="buy";
      let hitAt=null, why="";
      if(buy){ if(p.sl!=null&&q.bid<=p.sl){ hitAt=p.sl; why="Stop loss"; } else if(p.tp!=null&&q.bid>=p.tp){ hitAt=p.tp; why="Take profit"; } }
      else{ if(p.sl!=null&&q.ask>=p.sl){ hitAt=p.sl; why="Stop loss"; } else if(p.tp!=null&&q.ask<=p.tp){ hitAt=p.tp; why="Take profit"; } }
      if(hitAt!=null){ const net=closePos(p,why,hitAt); changed=true; toast(`${p.sym} ${sgnUsd(net)}`,net>=0?"":"loss",why+" hit"); beep(net>=0?660:300,net>=0?880:180); }
    }
    for(const a of c.accts){
      let st=accStats(a), guard=0;
      while(st.mg>0&&st.lvl<=CFG.stopOut&&guard++<50){
        const mine=c.pos.filter(p=>p.acct===a.id); if(!mine.length) break;
        let worst=mine[0], wv=Infinity;
        for(const p of mine){ const v=pnl(p,quote(p.sym,a.type)); if(v<wv){ wv=v; worst=p; } }
        closePos(worst,"Stop out"); changed=true; toast(`#${a.no} reached the stop-out level. ${worst.sym} was closed.`,"loss","Stop out"); beep(300,160);
        st=accStats(a);
      }
      if(st.mg>0&&st.lvl<=CFG.marginCall){ if(!MC[a.id]){ MC[a.id]=1; toast(`#${a.no} margin level is ${st.lvl.toFixed(0)}%. Add funds or close positions.`,"loss","Margin call"); } }
      else MC[a.id]=0;
    }
  }
  if(c.copy.length){ copyTick(c); if(sparkN%20===0) changed=true; }
  if(changed) persist();
  if(S.view==="terminal") termUpdate(changed);
}

function pageTerminal(p){
  if(!CFG.cfdOn){ p.innerHTML='<h1>Terminal</h1><div class="empty">The CFD terminal is switched off by the administrator.</div>'; return; }
  const c=cfdD(); if(!c.accts.length&&TS.sub==="terminal") TS.sub="accounts";
  if(TS.sub==="copy"&&!CFG.copyOn) TS.sub="terminal";
  const subs=[["terminal","Terminal"],["accounts","Accounts"],["calc","Calculator"],["cal","Calendar"],["copy","Copy trading"]].filter(s=>s[0]!=="copy"||CFG.copyOn);
  p.innerHTML=`<h1>Terminal</h1><p class="sub">Trade Forex, metals, crypto, stocks and indices with leverage on simulated CFD accounts.</p>

// chart
function xDraw(cv){
  const r=cv.getBoundingClientRect(), dp=window.devicePixelRatio||1; if(!r.width) return;
  if(cv._w!==r.width||cv._h!==r.height||cv._d!==dp){ cv.width=r.width*dp; cv.height=r.height*dp; cv._w=r.width; cv._h=r.height; cv._d=dp; }
  const g=cv.getContext("2d"); g.setTransform(dp,0,0,dp,0,0); g.clearRect(0,0,r.width,r.height);
  const a=cfdAcct(); if(!a) return;
  const sym=TS.sym, W=r.width, H=r.height, PR=74, PB=22, PT=10, plotW=W-PR, plotH=H-PB-PT, d=idec(sym);
  const cs=C[sym].slice(-80), q=quote(sym,a.type), up=css("--up"), dn=css("--down"), mu=css("--muted"), tx=css("--text"), blue=css("--accent2")||"#3b82f6";
  const mine=cfdD().pos.filter(p=>p.acct===a.id&&p.sym===sym), ords=cfdD().ord.filter(o=>o.acct===a.id&&o.sym===sym);
  let lo=Infinity, hi=-Infinity; for(const c of cs){ lo=Math.min(lo,c.l); hi=Math.max(hi,c.h); }
  lo=Math.min(lo,q.bid); hi=Math.max(hi,q.ask);
  for(const p of mine){ lo=Math.min(lo,p.open); hi=Math.max(hi,p.open); }
  const pad=(hi-lo)*.12||1e-6; lo-=pad; hi+=pad;
  const y=v=>PT+(hi-v)/(hi-lo)*plotH, step=plotW/cs.length, bw=Math.max(1,step*.62);
  g.font="11px "+MONO; g.textBaseline="middle"; g.textAlign="left";
  const raw=(hi-lo)/5, mag=Math.pow(10,Math.floor(Math.log10(raw))), gs=[1,2,5,10].map(k=>k*mag).find(s=>s>=raw);
  for(let v=Math.ceil(lo/gs)*gs; v<hi; v+=gs){ const yy=y(v); g.strokeStyle="rgba(128,128,140,.16)"; g.beginPath(); g.moveTo(0,yy); g.lineTo(plotW,yy); g.stroke(); g.fillStyle=mu; g.fillText(v.toFixed(d),plotW+8,yy); }
  cs.forEach((c,i)=>{
    const x=i*step+step/2, col=c.c>=c.o?up:dn; g.strokeStyle=col; g.fillStyle=col;
    g.beginPath(); g.moveTo(Math.round(x)+.5,y(c.h)); g.lineTo(Math.round(x)+.5,y(c.l)); g.stroke();
    const yo=y(c.o), yc=y(c.c); g.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yo-yc)));
  });
  const tag=(v,col,txt)=>{ const yy=y(v); g.fillStyle=col; g.beginPath(); g.roundRect(plotW+2,yy-9,PR-6,18,5); g.fill(); g.fillStyle="#fff"; g.textAlign="center"; g.fillText(txt||v.toFixed(d),plotW+PR/2-1,yy); g.textAlign="left"; };
  const line=(v,col,dash,label)=>{ const yy=y(v); if(yy<PT-2||yy>PT+plotH+2) return; g.setLineDash(dash); g.strokeStyle=col; g.lineWidth=1; g.beginPath(); g.moveTo(0,yy); g.lineTo(plotW,yy); g.stroke(); g.setLineDash([]); if(label){ g.fillStyle=col; g.fillText(label,8,yy-8); } };
  line(q.bid,dn,[4,3]); line(q.ask,blue,[4,3]); tag(q.bid,dn); tag(q.ask,blue);
  for(const p of mine){
    const v=pnl(p,quote(sym,a.type)), col=p.side==="buy"?up:dn;
    line(p.open,col,[],`${p.side==="buy"?"BUY":"SELL"} ${p.lots}  ${sgnUsd(round2(v))}`);
    if(p.sl!=null) line(p.sl,dn,[2,3],"SL"); if(p.tp!=null) line(p.tp,up,[2,3],"TP");
  }
  for(const o of ords) line(o.price,mu,[2,4],`${o.side==="buy"?"BUY":"SELL"} ${o.kind.toUpperCase()} ${o.lots}`);
  g.fillStyle=mu; g.textAlign="center"; const per=Math.ceil(100/step);
  for(let i=cs.length-1;i>=0;i-=per){ const x=i*step+step/2; if(x<24||x>plotW-10) continue; g.fillText(new Date(cs[i].t).toTimeString().slice(0,8),x,H-PB/2+2); }
}

const CAL=[["USD","Non-Farm Payrolls",3,"k"],["USD","CPI y/y",3,"p"],["USD","FOMC Rate Decision",3,"r"],["USD","Retail Sales m/m",2,"p"],["USD","Initial Jobless Claims",2,"k"],["USD","ISM Manufacturing PMI",2,"n"],
  ["EUR","ECB Rate Decision",3,"r"],["EUR","German CPI m/m",2,"p"],["EUR","Eurozone GDP q/q",2,"p"],["EUR","Services PMI",1,"n"],
  ["GBP","BoE Rate Decision",3,"r"],["GBP","UK CPI y/y",3,"p"],["GBP","Retail Sales m/m",2,"p"],["GBP","Claimant Count Change",1,"k"],
  ["JPY","BoJ Policy Rate",3,"r"],["JPY","Tokyo CPI y/y",2,"p"],["JPY","Trade Balance",1,"n"]];
function hsh(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function calEvents(){
  const out=[], now=Date.now();
  for(let dd=-1;dd<=6;dd++){
    const day=new Date(now+dd*864e5), ds=day.toISOString().slice(0,10), used=new Set();
    for(let i=0;i<6;i++){
      const idx=hsh(ds+"e"+i)%CAL.length; if(used.has(idx)) continue; used.add(idx);
      const e=CAL[idx], t=new Date(ds+"T00:00:00"); t.setHours(6+hsh(ds+"h"+idx)%14,[0,15,30,45][hsh(ds+"m"+idx)%4]);
      const k=e[3], v=(s,sc)=>hsh(ds+s+idx)%sc;
      let prev,fc,act,u="";
      if(k==="p"){ prev=v("p",50)/10-.5; fc=prev+(v("f",7)-3)/10; act=fc+(v("a",9)-4)/10; u="%"; }
      else if(k==="r"){ prev=3+v("p",20)*.25; fc=prev; act=prev+((v("a",3)-1)*.25); u="%"; }
      else if(k==="k"){ prev=120+v("p",180); fc=prev+v("f",40)-20; act=fc+v("a",60)-30; u="K"; }
      else{ prev=46+v("p",120)/10; fc=prev+(v("f",7)-3)/10; act=fc+(v("a",9)-4)/10; }
      out.push({t:t.getTime(),cur:e[0],name:e[1],imp:e[2],prev:prev.toFixed(1)+u,fc:fc.toFixed(1)+u,act:t.getTime()<now?act.toFixed(1)+u:"–",beat:act>fc?1:act<fc?-1:0});
    }
  }
  return out.sort((a,b)=>a.t-b.t);
}
function xCal(b){
  b.innerHTML=`<div class="bar"><button class="chip ${TS.imp===0?"on":""}" data-i="0">All impact</button><button class="chip ${TS.imp===3?"on":""}" data-i="3">High</button><button class="chip ${TS.imp===2?"on":""}" data-i="2">Medium</button><button class="chip ${TS.imp===1?"on":""}" data-i="1">Low</button>

    <p class="note">Simulated calendar for practice. Events and values are generated and are not real data.</p>`;
  b.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{ TS.imp=+x.dataset.i; xCal(b); });
  $("cC").onchange=e=>{ TS.cur=e.target.value; xCal(b); };
  const ev=calEvents().filter(e=>(!TS.imp||e.imp===TS.imp)&&(TS.cur==="all"||e.cur===TS.cur)), now=Date.now(); let day="", h="";
  for(const e of ev){
    const d=new Date(e.t).toDateString(); if(d!==day){ if(day) h+="</tbody></table>"; day=d; h+=`<h4 class="xday">${d===new Date().toDateString()?"Today · ":""}${d}</h4><table class="xcal"><thead><tr><th>Time</th><th>Cur</th><th>Impact</th><th>Event</th><th>Actual</th><th>Forecast</th><th>Previous</th></tr></thead><tbody>`; }
    h+=`<tr class="${e.t<now?"past":""}"><td>${new Date(e.t).toTimeString().slice(0,5)}</td><td><b>${e.cur}</b></td><td><span class="imp i${e.imp}"><i></i><i></i><i></i></span></td><td>${e.name}</td><td class="${e.beat>0?"win":e.beat<0?"loss":""}">${e.act}</td><td>${e.fc}</td><td>${e.prev}</td></tr>`;
  }
  $("cList").innerHTML=h?h+"</tbody></table>":'<div class="empty">No events match.</div>';
}

function hubDepositDo(ev){
  ev.preventDefault(); const u=U(), amt=round2(parseFloat($("dp_amt").value)), to=$("dp_to").value, err=m=>$("dp_err").textContent=m;
  if(!CFG.depositOn) return err("Deposits are currently disabled.");
  if(!(amt>=1)) return err("Enter an amount of at least AED 1.");
  if(amt>CFG.txMax) return err("Maximum is AED "+CFG.txMax.toLocaleString()+" per transaction.");
  addBal(u.acct,amt); addTx("deposit",amt,u.acct,HUB.method);
  if(to!=="wallet"){
    const a=cfdD().accts.find(x=>x.id===to), usd=round2(amt/USD_AED);
    addBal(u.acct,-amt); a.bal=round2(a.bal+usd); addTx("withdraw",-amt,u.acct,"To trading account #"+a.no);
    toast(fmtUsd(usd)+" added to #"+a.no,"","Deposit successful");
  }else toast("+"+fmtMoney(amt),"","Deposit successful");
  persist(); renderBal(); hubBody();
}

function hubWdPrev(){ const a=parseFloat($("wd_amt").value); $("wd_prev").textContent=a>0?`≈ ${fmtUsd(a/USD_AED)} · 1 USD = ${USD_AED} AED · no fee`:"Funds leave your wallet instantly in this simulator."; }
function hubWithdrawDo(ev){
  ev.preventDefault(); const u=U(), amt=round2(parseFloat($("wd_amt").value)), from=$("wd_from").value, err=m=>$("wd_err").textContent=m, c=cfdD();
  if(!CFG.withdrawOn) return err("Withdrawals are currently disabled.");
  if(!(amt>=1)) return err("Enter an amount of at least AED 1.");
  if(amt>CFG.txMax) return err("Maximum is AED "+CFG.txMax.toLocaleString()+" per transaction.");
  let a=null, usd=0;
  if(from!=="wallet"){
    a=c.accts.find(x=>x.id===from); usd=round2(amt/USD_AED);
    if(usd>accStats(a).free) return err("Only "+fmtUsd(Math.max(0,accStats(a).free))+" of free margin can be withdrawn from this account.");
    if(usd>a.bal) return err("Amount exceeds the account balance.");
  }else if(amt>bal()) return err("Amount exceeds your wallet balance ("+fmtMoney(bal())+").");
  if(a){ a.bal=round2(a.bal-usd); addBal(u.acct,amt); addTx("deposit",amt,u.acct,"From trading account #"+a.no); }
  addBal(u.acct,-amt); addTx("withdraw",-amt,u.acct,HUB.method);
  persist(); renderBal(); toast("−"+fmtMoney(amt),"tie","Withdrawal successful"); hubBody();
}

function hubSwap(){ const t=HUB.tr; [t.from,t.to]=[t.to,t.from]; hubBody(); }
function hubTfPrev(){ const t=HUB.tr, a=parseFloat($("tf_amt").value), w=t.from==="wallet"||t.to==="wallet"; $("tf_prev").textContent=a>0?(w?`= ${fmtMoney(a*USD_AED)} · no fee`:"No fee"):"Transfers are free and instant."; }
function hubTransferDo(ev){
  ev.preventDefault(); const c=cfdD(), u=U(), t=HUB.tr, usd=round2(parseFloat($("tf_amt").value)), err=m=>$("tf_err").textContent=m;
  if(t.from===t.to) return err("Choose two different accounts.");
  if(!(usd>=1)) return err("Enter an amount of at least $1.");
  if(usd>1e7) return err("Amount is too large.");
  const A=t.from==="wallet"?null:c.accts.find(x=>x.id===t.from), B=t.to==="wallet"?null:c.accts.find(x=>x.id===t.to), aed=round2(usd*USD_AED);
  if(!A){ if(aed>bal()) return err("Not enough balance in your wallet ("+fmtMoney(bal())+")."); }
  else{ if(usd>accStats(A).free) return err("Only "+fmtUsd(Math.max(0,accStats(A).free))+" of free margin can be moved from this account."); if(usd>A.bal) return err("Amount exceeds the account balance."); }
  if(A&&B){ A.bal=round2(A.bal-usd); B.bal=round2(B.bal+usd); c.xfer=c.xfer||[]; c.xfer.unshift({id:uid(),t:Date.now(),from:A.no,to:B.no,usd}); if(c.xfer.length>100) c.xfer.length=100; }
  else if(!A){ addBal(u.acct,-aed); B.bal=round2(B.bal+usd); addTx("withdraw",-aed,u.acct,"To trading account #"+B.no); }
  else{ A.bal=round2(A.bal-usd); addBal(u.acct,aed); addTx("deposit",aed,u.acct,"From trading account #"+A.no); }
  HUB.tr.amt=""; persist(); renderBal(); toast(fmtUsd(usd),"","Transfer complete"); hubBody();
}

// ---------------- ledger / transaction history ----------------
function hubLedger(){
  const u=U(), c=cfdD(), out=[];
  const LBL={deposit:"Deposit",withdraw:"Withdrawal",transfer:"Transfer",bonus:"Bonus",crypto:"Crypto",other:"Other"};
  for(const x of u.tx){
    const n=x.note||"";
    const kind=/^(To|From) trading account|^Closed trading account/.test(n)?"transfer":/^(Bought|Sold) /.test(n)?"crypto":/^(Cashback|Referral)/.test(n)?"bonus":x.type==="deposit"?"deposit":x.type==="withdraw"?"withdraw":"other";
    out.push({t:x.time,kind,label:LBL[kind],amt:x.amt,cur:"AED",note:n||({reset:"Balance reset",adjust:"Admin adjustment",deposit:"Deposit",withdraw:"Withdrawal"}[x.type]||x.type),wallet:ACCT_NAMES[x.acct]});
  }
  for(const x of c.xfer||[]) out.push({t:x.t,kind:"transfer",label:"Transfer",amt:x.usd,cur:"USD",note:`Account #${x.from} → #${x.to}`,wallet:"Trading accounts"});
  return out.sort((a,b)=>b.t-a.t);
}

function hubCryPrev(){

function hubCryDo(ev){
  ev.preventDefault(); const u=U(), h=hubU(), cs=HUB.cry, x=CRY[cs.sym], a=parseFloat($("cr_a").value), px=x.px(), err=m=>$("cr_err").textContent=m;
  if(!(a>0)) return err("Enter an amount greater than 0.");
  if(cs.side==="buy"){
    const aed=round2(a); if(aed<1) return err("Minimum purchase is AED 1."); if(aed>bal()) return err("Not enough balance in your wallet.");
    const q=aed/USD_AED/px*.998; addBal(u.acct,-aed); h.cry[cs.sym]=(h.cry[cs.sym]||0)+q; addTx("withdraw",-aed,u.acct,"Bought "+q.toFixed(x.d)+" "+cs.sym);
    toast(q.toFixed(x.d)+" "+cs.sym,"","Purchase complete");
  }else{

  const lots=l.reduce((s,h)=>s+h.lots,0), best=l.length?Math.max(...l.map(h=>h.net)):0, worst=l.length?Math.min(...l.map(h=>h.net)):0;

function hubCurve(l){
  if(l.length<2) return '<div class="empty">Close at least two positions to see the curve.</div>';
  let s=0; const v=[0,...l.map(h=>s+=h.net)], lo=Math.min(...v), hi=Math.max(...v), r=(hi-lo)||1, W=600, H=150;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(H-8-(y-lo)/r*(H-16)).toFixed(1)}`), z=(H-8-(0-lo)/r*(H-16)).toFixed(1), col=v[v.length-1]>=0?"var(--up)":"var(--down)";
  return `<svg class="hbcurve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)" stroke-dasharray="4 4"/><polygon points="0,${z} ${pts.join(" ")} ${W},${z}" fill="${col}" opacity=".14"/><polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function hubBySym(l){
  if(!l.length) return '<div class="empty">No closed positions in this period.</div>';
  const g={}; for(const h of l){ const x=g[h.sym]||(g[h.sym]={n:0,w:0,lots:0,net:0}); x.n++; x.lots+=h.lots; x.net+=h.net; if(h.net>0) x.w++; }
  return `<div class="tw"><table><thead><tr><th>Instrument</th><th>Trades</th><th>Win rate</th><th>Volume</th><th>Net</th></tr></thead><tbody>${Object.entries(g).sort((a,b)=>b[1].net-a[1].net).map(([k,x])=>`<tr><td><b>${esc(k)}</b></td><td>${x.n}</td><td>${Math.round(x.w/x.n*100)}%</td><td>${x.lots.toFixed(2)} lots</td><td class="${x.net>=0?"up":"down"}">${sgnUsd(x.net)}</td></tr>`).join("")}</tbody></table></div>`;
}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const fx=$("fx"), fctx=fx.getContext("2d"); let parts=[], fxOn=false;
function sizeFx(){ fx.width=innerWidth; fx.height=innerHeight; }
addEventListener("resize",sizeFx); sizeFx();
function confetti(){
  if(RM) return;
  const cols=["#19f0a8","#7c5cff","#ffd166","#ff4f70","#4dd0ff"];
  for(let i=0;i<110;i++) parts.push({x:innerWidth*0.45+(Math.random()-.5)*240,y:innerHeight*0.4,vx:(Math.random()-.5)*15,vy:-Math.random()*15-3,g:.36,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%5],life:1});
  if(!fxOn){ fxOn=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);
  for(const p of parts){
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.r+=p.vr; p.life-=.009;
    fctx.save(); fctx.globalAlpha=Math.max(0,p.life); fctx.translate(p.x,p.y); fctx.rotate(p.r);
    fctx.fillStyle=p.c; fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fctx.restore();
  }
  if(parts.length) requestAnimationFrame(fxLoop); else { fxOn=false; fctx.clearRect(0,0,fx.width,fx.height); }
}

// trading-themed background art (candles, trend line, volume, currency glyphs), generated once
function buildBgArt(){
  let seed=11; const rnd=()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  const W=1600,H=900,N=54,st=W/N; let s="";
  for(let y=100;y<H;y+=100) s+='<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--text)" opacity=".06"/>';
  for(let x=0;x<W;x+=160) s+='<line y1="0" y2="'+H+'" x1="'+x+'" x2="'+x+'" style="stroke:var(--text)" opacity=".035"/>';
  let vol="",c="",line=[],prev=720;
  for(let i=0;i<N;i++){
    const y=720-(i/(N-1))*430+(rnd()-.5)*95, x=i*st+st/2, hi=Math.min(prev,y)-rnd()*26, lo=Math.max(prev,y)+rnd()*26, up=y<prev, col=up?"var(--up)":"var(--down)";
    c+='<line x1="'+x+'" x2="'+x+'" y1="'+hi.toFixed(1)+'" y2="'+lo.toFixed(1)+'" style="stroke:'+col+'" stroke-width="2"/><rect x="'+(x-9)+'" y="'+Math.min(prev,y).toFixed(1)+'" width="18" height="'+Math.max(4,Math.abs(y-prev)).toFixed(1)+'" rx="3" style="fill:'+col+'"/>';
    vol+='<rect x="'+(x-9)+'" y="'+(H-14-rnd()*80).toFixed(1)+'" width="18" height="90" rx="3" style="fill:'+col+'" opacity=".5"/>';
    line.push([x,y]); prev=y;
  }
  const d=line.map((p,i)=>{ if(!i) return "M"+p[0]+","+p[1].toFixed(1); const m=(line[i-1][0]+p[0])/2; return "C"+m+","+line[i-1][1].toFixed(1)+" "+m+","+p[1].toFixed(1)+" "+p[0]+","+p[1].toFixed(1); }).join(" ");
  const last=line[line.length-1], G=["$","€","¥","₿","%","£"];
  s+='<defs><linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)" stop-opacity=".35"/><stop offset="1" style="stop-color:var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  s+='<g class="bgDrift"><path d="'+d+' L'+last[0]+','+H+' L'+line[0][0]+','+H+'Z" fill="url(#bgA)"/><g opacity=".6">'+c+'</g><g opacity=".4">'+vol+'</g>'+
     '<path d="'+d+'" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".75"/><circle cx="'+last[0]+'" cy="'+last[1].toFixed(1)+'" r="9" style="fill:var(--accent)"/><circle class="bgPing" cx="'+last[0]+'" cy="'+last[1].toFixed(1)+'" r="9" fill="none" style="stroke:var(--accent)" stroke-width="2"/></g>';
  [[90,170,150],[1240,120,120],[620,330,100],[1380,470,130],[260,520,110],[900,150,90]].forEach((g,i)=>{
    s+='<text class="bgFloat" x="'+g[0]+'" y="'+g[1]+'" font-size="'+g[2]+'" font-weight="800" style="fill:var(--text);animation-delay:-'+(i*3)+'s" opacity=".07">'+G[i]+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+s+'</svg>';
}
(function(){ const b=document.createElement("div"); b.id="bgArt"; b.innerHTML=buildBgArt(); document.body.prepend(b); })();
